services:
  - type: web
    name: migration-workbench
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: DEMO_EMAIL
        value: reviewer@example.com
      - key: DEMO_PASSWORD
        value: Review@123
